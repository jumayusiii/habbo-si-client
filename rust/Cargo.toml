[package]
name = "habbo-si-client-rust"
version = "1.2.0-beta.5"
edition = "2024"
rust-version = "1.85"
description = "Lightweight native Rust beta client for habbo.si"
license = "MIT"

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.34"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
wry = { version = "0.57", features = ["devtools"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
strip = "none"
panic = "unwind"
